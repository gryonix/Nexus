# AGP 9 and Kotlin 2.4 are not certified against the JDK 26 Homebrew installs
# by default, and the failure mode is an unsupported-class-file-version error
# deep inside a Kotlin task rather than an honest message up front. The daemon
# is therefore pinned to Java 21 — but by VERSION, in
# `gradle/gradle-daemon-jvm.properties`, not by an absolute path here: a path
# names one machine's JDK, and Android Studio (which runs the build with its
# own bundled JBR) would fail sync outright on a path that is not there.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
